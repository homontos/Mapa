<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Interaktywna Mapa</title>
    
    <!-- Bezpieczne, oficjalne linki do biblioteki Leaflet z sumami kontrolnymi -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f0f0f0; /* Jasne tło zamiast pustki, jeśli sieć wolno działa */
        }

        /* Wymuszenie na sztywno, by mapa zajmowała cały ekran widoku (vh/vw) */
        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .interfejs-nad-mapa {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000; /* Wyższy indeks, aby panel nie zniknął pod mapą */
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-family: Arial, sans-serif;
            max-width: 300px;
        }
    </style>
</head>
<body>

    <div class="interfejs-nad-mapa">
        <h3>Moje Projekty</h3>
        <p>Jeśli tło nadal jest szare, upewnij się, że masz połączenie z internetem.</p>
    </div>

    <div id="map"></div>

    <script>
        // Inicjalizacja mapy na współrzędnych Warszawy
        const map = L.map('map').setView([52.23, 21.01], 6);

        # Zabezpieczony i uniwersalny adres serwera OpenStreetMap
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Odświeżenie rozmiaru mapy w locie (rozwiązuje problem z białym tłem na niektórych urządzeniach)
        setTimeout(function, 500() {
            map.invalidateSize();
        });
    </script>

</body>
</html>
